name: BoxServer

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    container_name: BoxPostgres
    environment:
      POSTGRES_DB: boxserver
      POSTGRES_USER: boxserver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - ./postgresql:/var/lib/postgresql

  redis:
    image: redis:8
    restart: unless-stopped
    container_name: BoxRedis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis:/data