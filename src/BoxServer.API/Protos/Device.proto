syntax = "proto3";

import "google/protobuf/any.proto";

option csharp_namespace = "BoxServer.API.GRPC";

option go_package = "boxagent/internal/pb";

package device;

message DeviceRequest {
    string id = 1;
    string host_name = 2;
    string os_name = 3;
    string os_version = 4;
    string os_architecture = 5;
    string ip_address = 6;
    string mac_address = 7;
    string cpu = 8;
    int64 ram = 9;
    int64 disk = 10;
    int64 uptime = 11;
    string agent_version = 12;
    double cpu_usage = 13;
    double ram_usage = 14;
    double disk_usage = 15;
    double net_in = 16;
    double net_out = 17;
    repeated DeviceProcess processes = 18;
}

message DeviceProcess {
    int32 pid = 1;
    string name = 2;
    string user = 3;
    // running, suspended or not-responding
    string status = 4;
    // Percent of the whole machine.
    double cpu = 5;
    double memory_mb = 6;
}

message DeviceResponse {
    google.protobuf.Any data = 1;
}

service DeviceGRPC {
    rpc Ping(DeviceRequest) returns (DeviceResponse);
}
