syntax = "proto3";

import "google/protobuf/any.proto";

option csharp_namespace = "BoxServer.API.GRPC";

package device;

message DeviceRequest {
    string host_name = 1;
    string os_name = 2;
    string os_version = 3;
    string os_architecture = 4;
    string ip_address = 5;
    string mac_address = 6;
    string cpu = 7;
    int64 ram = 8;
    int64 disk = 9;
    int64 uptime = 10;
}

message DeviceResponse {
    google.protobuf.Any data = 1;
}

service DeviceGRPC {
    rpc Ping(DeviceRequest) returns (DeviceResponse);
}